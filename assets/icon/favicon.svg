<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161618" />
      <stop offset="100%" stop-color="#0b0b0d" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4b58" />
      <stop offset="100%" stop-color="#e63946" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cccccc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e63946" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#redGrad)" stroke-width="12" />

  <!-- Dumbbell Graphic -->
  <g transform="translate(0, -10)">
    <!-- Central Barbell Shaft -->
    <rect x="136" y="238" width="240" height="24" rx="6" fill="url(#silverGrad)" />

    <!-- Stoppers -->
    <rect x="180" y="196" width="16" height="108" rx="4" fill="url(#silverGrad)" />
    <rect x="316" y="196" width="16" height="108" rx="4" fill="url(#silverGrad)" />

    <!-- Inner Plates (White/Silver) -->
    <rect x="144" y="160" width="30" height="180" rx="8" fill="#ffffff" />
    <rect x="338" y="160" width="30" height="180" rx="8" fill="#ffffff" />

    <!-- Outer Plates (Red Accent) -->
    <rect x="104" y="130" width="34" height="240" rx="10" fill="url(#redGrad)" filter="url(#glow)" />
    <rect x="374" y="130" width="34" height="240" rx="10" fill="url(#redGrad)" filter="url(#glow)" />

    <!-- Collars / Caps -->
    <rect x="80" y="222" width="18" height="56" rx="4" fill="url(#silverGrad)" />
    <rect x="414" y="222" width="18" height="56" rx="4" fill="url(#silverGrad)" />
  </g>

  <!-- Typography IRONFIT -->
  <text x="256" y="426" font-family="'Inter', 'Arial', sans-serif" font-weight="900" font-size="58" fill="#ffffff" text-anchor="middle" letter-spacing="4">IRON<tspan fill="#e63946">FIT</tspan></text>
</svg>
